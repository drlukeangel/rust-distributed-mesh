[package]
name = "rafka-mesh-audit"
version = "0.1.0"
edition = "2021"
description = "i143 opening-audit gates: legacy-binary disposition, parity ledger scanner, dependency rules"
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[[bin]]
name = "parity-scan"
path = "src/bin/parity_scan.rs"

[[bin]]
name = "dep-rules"
path = "src/bin/dep_rules.rs"

[[bin]]
name = "address-lookup"
path = "src/bin/address_lookup.rs"
