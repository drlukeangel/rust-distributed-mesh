[package]
autotests = false
name = "rdm-docgen"
version = "0.1.0"
edition = "2021"
description = "Reads RDM source with syn and writes the generated reference pages (spans, config) into docs/reference/rdm, and checks that the wire bodies, the gossip Frame and the statuses state their positions and serialized names in their doc comments"
publish = false

[lib]
name = "rdm_docgen"
path = "src/lib.rs"

[[bin]]
name = "rdm-docgen"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rafka_mesh_audit = { package = "rdm-mesh-audit", path = "../mesh-audit" }
