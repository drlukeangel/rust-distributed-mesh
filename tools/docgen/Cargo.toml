[package]
autotests = false
name = "rdm-docgen"
version = "0.1.0"
edition = "2021"
description = "Reads RDM source with syn and writes the generated reference pages (wire, frames, statuses, spans, config) and the book SUMMARY into a rafka-v2 checkout"
publish = false

[lib]
name = "rafka_docgen"
path = "src/lib.rs"

[[bin]]
name = "rdm-docgen"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rafka_mesh_audit = { package = "rdm-mesh-audit", path = "../mesh-audit" }
