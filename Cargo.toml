[workspace]
members = [
    "crates/rafka-mesh-telemetry",
    "crates/rafka-mesh-transport",
    "crates/rafka-mesh-ops",
    "crates/rafka-node-base",
    "crates/rafka-chaos",
    "crates/rafka-node-rpc",
    "crates/rafka-node-rpc-testkit",
    "crates/rafka-node-admin-core",
    "crates/rafka-node-admin-client",
    "crates/rafka-node-rpc-contract",
    "crates/rafka-mesh-entity",
    "crates/rafka-test-scenario",
    "crates/rafka-consumer-fixture",
    "gateway",
    "broker",
    "compute",
    "registry",
    "admin-ui",
    "cli/rfa",
    "tools/mesh-audit",
    "crates/scratch-json-dumper",
]
# The R-shape qualification consumer is an independent customer: its own workspace root and
# lockfile, importing RDM by git rev (scripts/i143-rshape-build-consumer.sh).
exclude = ["qualification/rshape-consumer"]
resolver = "2"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.28"

# opentelemetry
opentelemetry = { version = "0.27", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "trace", "logs"] }
opentelemetry-semantic-conventions = "0.27"

# iroh, iroh-base and iroh-gossip come from drlukeangel's forks, each pinned to the exact carrying
# commit (never a branch), as direct git dependencies: a git importer sees no root [patch], so the
# forks themselves depend on each other by git (iroh -> netwatch, noq; iroh-gossip -> iroh, noq) and
# the graph holds one iroh, netwatch and noq. The iroh fork carries path retirement
# (Endpoint::replace_direct_addrs), the mapped-address and waker-loss fixes and the bind span fix;
# netwatch enumerates interfaces on the blocking pool; iroh-gossip's net actor never awaits a full
# per-peer send queue (try_send drops that one enqueue and Plumtree repairs it). Vendor divergence
# and its removal condition: rafka-v2 docs/eng/vendor-divergence.md (i143.e4.s12).
iroh = { git = "https://github.com/drlukeangel/iroh", rev = "1d27e4ea253b4a37fcbe2a346ba13e1310fc1fd5" }
iroh-base = { git = "https://github.com/drlukeangel/iroh", rev = "1d27e4ea253b4a37fcbe2a346ba13e1310fc1fd5" }
iroh-gossip = { git = "https://github.com/drlukeangel/iroh-gossip", rev = "4b6f5588d55b31917ac1b9c956bc456040ca6bb9" }

# identity persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
anyhow = "1"

# encoding
hex = "0.4"
rand = "0.8"
bincode = { version = "2", features = ["serde"] }
dashmap = "6"

# iroh-quinn-proto patch block removed on the iroh 0.98 bump: the
# GSO/TLP segment-size assertion is fixed upstream as of 0.98's bundled
# iroh-quinn-proto, so the local fork override is no longer needed.

# The Windows-host churn-memory-leak forks (E:/iroh, E:/iroh-gossip, E:/noq)
# are opted into per host, never from this file: a path patch that does not
# exist breaks cargo everywhere else. See deployment/dev/windows-iroh-patches.toml.

# Debug builds keep line tables only: backtraces and span file:line stay exact, while each test
# binary is a fraction of a full-debuginfo one (a gate links hundreds of them per lane).
[profile.dev]
debug = "line-tables-only"

# The executable-binding check hashes whole (debug-sized, hundreds of MB) executables at every
# launch: the hash runs at release speed even in a debug build.
[profile.dev.package.sha2]
opt-level = 3
