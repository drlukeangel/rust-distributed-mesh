[workspace]
members = [
    "crates/rafka-mesh-telemetry",
    "crates/rafka-mesh-transport",
    "crates/rafka-mesh-ops",
    "crates/rafka-node-base",
    "crates/rafka-chaos",
    "crates/rafka-node-rpc",
    "crates/rafka-node-rpc-testkit",
    "crates/rafka-node-admin-core",
    "crates/rafka-node-admin-client",
    "crates/rafka-node-rpc-contract",
    "crates/rafka-mesh-entity",
    "crates/rafka-test-scenario",
    "crates/rafka-consumer-fixture",
    "crates/test-roles/gateway",
    "crates/test-roles/broker",
    "crates/test-roles/compute",
    "tools/mesh-audit",
    "tools/test-runner",
    "crates/scratch-json-dumper",
]
# The R-shape qualification consumer is an independent customer: its own workspace root and
# lockfile, importing RDM by git rev (scripts/i143-rshape-build-consumer.sh).
exclude = ["demo"]
resolver = "2"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.28"

# opentelemetry
opentelemetry = { version = "0.27", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "trace", "logs"] }
opentelemetry-semantic-conventions = "0.27"

# iroh, iroh-base and iroh-gossip come from drlukeangel's forks, each pinned to the exact carrying
# commit (never a branch), as direct git dependencies: a git importer sees no root [patch], so the
# forks themselves depend on each other by git (iroh -> netwatch, noq; iroh-gossip -> iroh, noq) and
# the graph holds one iroh, netwatch and noq. The iroh fork carries path retirement
# (Endpoint::replace_direct_addrs), the mapped-address and waker-loss fixes and the bind span fix;
# a `test-knobs` Cargo feature, enabled from [dev-dependencies] only and audited by `dep-rules`, adds
# QuicTransportConfigBuilder::disable_nat_traversal_for_tests (R-I3: a test that owns every path through its
# own network seam sees no NAT-traversal path open; nothing in production changes);
# and Builder::network_monitor(bool), default true (R-B2): with false, Endpoint::bind constructs no
# netmon::Monitor and starts no interface enumeration, so a bind no longer queues behind the host's
# interface list (a NetworkManager and sysfs walk that takes seconds when many processes bind at once).
# The socket's monitor is an Option every consumer handles; an unspecified IP bind is refused by name in
# this mode, and the address facts a net report needs come from the bound transports. The netwatch
# commit iroh pins carries interfaces::interface_enumerations(), the count the fork's test asserts.
# Removal condition: upstream iroh accepts an endpoint option that binds without a network monitor.
# netwatch enumerates interfaces on the blocking pool; iroh-gossip's net actor never awaits a full
# per-peer send queue (try_send drops that one enqueue and Plumtree repairs it). Vendor divergence
# and its removal condition: rafka-v2 docs/eng/vendor-divergence.md (i143.e4.s12).
iroh = { git = "https://github.com/drlukeangel/iroh", rev = "921afe53685c0a28536062fff0ac15c8a8bf9190" }
iroh-base = { git = "https://github.com/drlukeangel/iroh", rev = "921afe53685c0a28536062fff0ac15c8a8bf9190" }
iroh-gossip = { git = "https://github.com/drlukeangel/iroh-gossip", rev = "c8fd82477b6da7c6ca19d2ba7669dcd1dbd0e9d1" }

# identity persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
anyhow = "1"

# encoding
hex = "0.4"
rand = "0.8"
bincode = { version = "2", features = ["serde"] }
dashmap = "6"

# iroh-quinn-proto patch block removed on the iroh 0.98 bump: the
# GSO/TLP segment-size assertion is fixed upstream as of 0.98's bundled
# iroh-quinn-proto, so the local fork override is no longer needed.

# Debug builds keep line tables only: backtraces and span file:line stay exact, while each test
# binary is a fraction of a full-debuginfo one (a gate links hundreds of them per lane).
[profile.dev]
debug = "line-tables-only"

# The executable-binding check hashes whole (debug-sized, hundreds of MB) executables at every
# launch: the hash runs at release speed even in a debug build.
[profile.dev.package.sha2]
opt-level = 3

# Every dependency (iroh, noq, rustls, ring, tokio) runs optimised in a debug build; the code under test
# stays unoptimised. A Node RPC call is two QUIC handshakes and the iroh endpoint actors, and at opt-level 0
# one call burns ~45 ms of CPU where the 500 ms budget cells leave 100 ms for the hop and the reply: a
# process that shares its core waits on the run queue for the CPU it needs and loses the budget.
[profile.dev.package."*"]
opt-level = 2
