[workspace]
members = [
    "crates/rafka-mesh-telemetry",
    "crates/rafka-mesh-transport",
    "crates/rafka-mesh-ops",
    "crates/rafka-node-base",
    "crates/rafka-chaos",
    "crates/rafka-node-rpc",
    "crates/rafka-node-rpc-testkit",
    "crates/rafka-node-admin-core",
    "crates/rafka-node-admin-client",
    "crates/rafka-node-rpc-contract",
    "crates/rafka-mesh-entity",
    "crates/rafka-test-scenario",
    "crates/rafka-consumer-fixture",
    "gateway",
    "broker",
    "compute",
    "registry",
    "admin-ui",
    "cli/rfa",
    "tools/mesh-audit",
    "crates/scratch-json-dumper",
]
# The R-shape qualification consumer is an independent customer: its own workspace root and
# lockfile, importing RDM by git rev (scripts/i143-rshape-build-consumer.sh).
exclude = ["qualification/rshape-consumer"]
resolver = "2"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.28"

# opentelemetry
opentelemetry = { version = "0.27", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "trace", "logs"] }
opentelemetry-semantic-conventions = "0.27"

# iroh 1 + iroh-gossip from drlukeangel/iroh-gossip, pinned to the exact
# carrying commit (never a branch). Upstream's net actor awaited a full
# per-peer send queue, so a peer that stopped draining deafened every topic
# and two actors flooding each other deadlocked; the fork's try_send drops
# that one enqueue and Plumtree repairs it. Vendor divergence and its removal
# condition: rafka-v2 docs/eng/vendor-divergence.md (i143.e4.s12).
iroh = { version = "1" }
iroh-base = { version = "1" }
iroh-gossip = { git = "https://github.com/drlukeangel/iroh-gossip", rev = "fcf426396d8a7e2555cc07335e4cada9b0473511" }

# identity persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
anyhow = "1"

# encoding
hex = "0.4"
rand = "0.8"
bincode = { version = "2", features = ["serde"] }
dashmap = "6"

# iroh-quinn-proto patch block removed on the iroh 0.98 bump: the
# GSO/TLP segment-size assertion is fixed upstream as of 0.98's bundled
# iroh-quinn-proto, so the local fork override is no longer needed.

# The Windows-host churn-memory-leak forks (E:/iroh, E:/iroh-gossip, E:/noq)
# are opted into per host, never from this file: a path patch that does not
# exist breaks cargo everywhere else. See deployment/dev/windows-iroh-patches.toml.

# iroh, iroh-base, netwatch and noq come from drlukeangel's forks at one pinned rev each (never a
# branch). iroh and iroh-base share one source, as do noq, noq-proto and noq-udp: two sources would
# give cargo two PublicKey types.
[patch.crates-io]
iroh = { git = "https://github.com/drlukeangel/iroh", rev = "b94cb9183cf45f92e10556587a463d826cdb1c20" }
iroh-base = { git = "https://github.com/drlukeangel/iroh", rev = "b94cb9183cf45f92e10556587a463d826cdb1c20" }
netwatch = { git = "https://github.com/drlukeangel/netwatch", rev = "ab1c3f05f136b14853485490bcea22341553f9ac" }
noq = { git = "https://github.com/drlukeangel/noq", rev = "d878a5ea83a7997c991967e1fe723bc4f059ead1" }
noq-proto = { git = "https://github.com/drlukeangel/noq", rev = "d878a5ea83a7997c991967e1fe723bc4f059ead1" }
noq-udp = { git = "https://github.com/drlukeangel/noq", rev = "d878a5ea83a7997c991967e1fe723bc4f059ead1" }

# The executable-binding check hashes whole (debug-sized, hundreds of MB) executables at every
# launch: the hash runs at release speed even in a debug build.
[profile.dev.package.sha2]
opt-level = 3
