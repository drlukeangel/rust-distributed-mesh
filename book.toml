# The docs site (mdBook), built locally by scripts/docs-site.sh (no CI): the guide from docs/ into
# target/docs-site/guide, beside the API docs (rustdoc) in target/docs-site/api. docs/SUMMARY.md is
# hand-written; docs/reference/rdm/ is generated by rdm-docgen (tools/docgen). mdbook-mermaid's two
# scripts are written into target/docs-site/mermaid by the script, from the installed mdbook-mermaid.
# The links are checked by the script (mdbook-linkcheck2 --standalone), not by `mdbook build`, so a
# dead link in a hand-written page is listed without failing the build.
[book]
title = "RDM: rust-distributed-mesh"
src = "docs"
language = "en"

[build]
build-dir = "target/docs-site/guide"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-js = ["target/docs-site/mermaid/mermaid.min.js", "target/docs-site/mermaid/mermaid-init.js"]
