[package]
name = "rdm-core"
version = "0.1.0"
edition = "2021"
description = "RDM core: ids and identity, Fabric/Mesh/Node model, the topology view and RuntimeFact types, Node RPC contract, and op names (no transport or runtime)"
publish = false
autotests = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
hex = { workspace = true }
rand = { workspace = true }
blake3 = "1"
sha2 = "0.11"
tracing = { workspace = true }
# The cert chain's keys (fabric-certs.md): the ed25519 keys iroh's are made of, taken directly, since
# the contract crate reaches no iroh crate (mesh-audit dependency rule 2). The requirement is iroh's
# own (>=3.0.0-rc.0, <4), never an exact pin, so it unifies with the version a consumer's lock
# resolves for iroh.
ed25519-dalek = { version = "3.0.0-rc.0", features = ["serde"] }

[dev-dependencies]
# One cell proves an iroh SecretKey and the ed25519 key of its bytes are one secret (dev-only: rule 2
# reads the normal and build closure).
iroh-base = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"
