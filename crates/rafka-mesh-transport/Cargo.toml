[package]
name = "rafka-mesh-transport"
version = "0.1.0"
edition = "2021"

# No doctest exists here, and a doctest build links the unhashed libiroh.rlib that any concurrent cargo run rewrites (vendor/iroh is a path crate).
[lib]
doctest = false

[dependencies]
tokio = { workspace = true }
futures-lite = "2"
tracing = { workspace = true }
iroh.workspace = true
iroh-gossip = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
blake3 = "1"
bytes = "1"

[dev-dependencies]
rafka-node-rpc = { path = "../rafka-node-rpc" }
