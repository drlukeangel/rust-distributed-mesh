[package]
name = "rafka-mesh-transport"
version = "0.1.0"
edition = "2021"
autotests = false

[lib]
doctest = false

[dependencies]
tokio = { workspace = true }
futures-lite = "2"
tracing = { workspace = true }
iroh.workspace = true
iroh-gossip = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
blake3 = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
bytes = "1"

[features]
# The test-only OS-clock skew (`clock::skew_os_clock_for_testkit`): enabled by the testkit alone.
testkit-skew = []

[dev-dependencies]
rafka-node-rpc = { path = "../rafka-node-rpc" }

[[test]]
name = "main"
path = "tests/main.rs"
