[package]
name = "rafka-node-rpc-testkit"
version = "0.1.0"
edition = "2021"
description = "Generic RPC proof node, protocols and probes for the i143 Mesh product proof"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
rafka-node-admin-core = { path = "../rafka-node-admin-core" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
rafka-node-rpc-contract = { path = "../rafka-node-rpc-contract" }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13.3", features = ["json"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# i143_acceptance_2775: the UNIT cell captures its own spans in an in-memory OTel exporter.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }

[[bin]]
name = "rafka-rpc-node"
path = "src/bin/rafka_rpc_node.rs"

[[bin]]
name = "rafka-rpc-probe"
path = "src/bin/rafka_rpc_probe.rs"

[[bin]]
name = "faulted-node-admin"
path = "src/bin/faulted_node_admin.rs"
