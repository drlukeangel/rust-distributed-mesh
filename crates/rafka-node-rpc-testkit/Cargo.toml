[package]
name = "rafka-node-rpc-testkit"
version = "0.1.0"
edition = "2021"
description = "Generic RPC proof node, protocols and probes for the i143 Mesh product proof"
publish = false
autotests = false

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
rafka-node-admin-core = { path = "../rafka-node-admin-core" }
# rafka-rpc-probe: the entry admin's view, read over Node RPC through the typed objects (fabric.get, node.get).
rdm-client = { path = "../rdm-client" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
rdm-core = { path = "../rdm-core" }
rdm-node = { path = "../rdm-node" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# rig: the reap stops each node it launched by a pidfd.
libc = { version = "0.2", optional = true }

[features]
# The launcher half of a functional fabric (`rig`), shared by test crates.
rig = ["dep:libc"]
# The OS-clock skew a testkit executable applies from its launch environment. Default for the
# testkit's own executables; the product role binaries depend on the testkit without it.
default = ["testkit-skew"]
testkit-skew = ["rafka-mesh-transport/testkit-skew"]

[dev-dependencies]
rafka-node-rpc-testkit = { path = ".", features = ["rig"] }
# tests/main.rs: the binary's process environment is set once, in its ctor, before any thread exists.
ctor = "0.2"
libc = "0.2"
tracing-subscriber = { workspace = true }
# i143_acceptance_2775: the UNIT cell captures its own spans through the product pipeline into an in-memory exporter.
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[[bin]]
name = "rafka-node"
path = "src/bin/rafka_node.rs"

[[bin]]
name = "rafka-rpc-node"
path = "src/bin/rafka_rpc_node.rs"

[[bin]]
name = "rafka-rpc-probe"
path = "src/bin/rafka_rpc_probe.rs"

[[bin]]
name = "faulted-node-admin"
path = "src/bin/faulted_node_admin.rs"

[[test]]
name = "main"
path = "tests/main.rs"

# `src/taskdump.rs`: the hang-capture build passes these two cfgs in RUSTFLAGS.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)", "cfg(tokio_taskdump)"] }
