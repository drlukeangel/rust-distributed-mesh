[package]
name = "rafka-mesh-entity"
version = "0.1.0"
edition = "2021"
description = "Generic Mesh EF: exact-node identity, process incarnation, membership and endpoint-slot freshness (i143)"
publish = false
autotests = false

[dependencies]
serde = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
blake3 = "1"
sha2 = "0.11"


[dev-dependencies]
# The i143 acceptance cell proves the receiver (`DigestBook`, in the transport crate) from the
# entity crate that owns the digest frame.
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
tokio = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"
