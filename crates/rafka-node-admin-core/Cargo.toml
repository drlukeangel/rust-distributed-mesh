[package]
name = "rafka-node-admin-core"
version = "0.1.0"
edition = "2021"
description = "Generic Fabric/Mesh/Node control: model, topology, Build, deployment and lifecycle (i143)"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
libc = "0.2"
iroh = { workspace = true }
iroh-gossip = { workspace = true }
blake3 = "1"
futures-lite = "2"
futures-util = "0.3"
bytes = "1"
axum = "0.8.9"
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
rafka-node-admin-client = { path = "../rafka-node-admin-client" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
rafka-node-rpc-contract = { path = "../rafka-node-rpc-contract" }

[[bin]]
name = "rafka-node-admin"
path = "src/bin/rafka_node_admin.rs"

[dev-dependencies]
# i143_acceptance_2805: each acceptance cell captures its own spans (one in-memory OTel exporter per
# cell, installed on that cell's runtime threads), so cells sharing a test process never share one.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { workspace = true }
http-body-util = "0.1"
