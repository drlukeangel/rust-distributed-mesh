[package]
name = "rafka-node-admin-core"
version = "0.1.0"
edition = "2021"
description = "Generic Fabric/Mesh/Node control: model, topology, Build, deployment and lifecycle (i143)"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
libc = "0.2"
iroh = { workspace = true }
iroh-gossip = "0.100"
blake3 = "1"
futures-lite = "2"
bytes = "1"
axum = "0.8.9"
rafka-telemetry = { path = "../rafka-telemetry" }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { workspace = true }
http-body-util = "0.1"
