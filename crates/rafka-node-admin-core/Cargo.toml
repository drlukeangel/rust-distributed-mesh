[package]
name = "rafka-node-admin-core"
version = "0.1.0"
edition = "2021"
description = "Generic Fabric/Mesh/Node control: model, topology, Build, deployment and lifecycle (i143)"
publish = false
autotests = false

[lib]
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
libc = "0.2"
iroh = { workspace = true }
iroh-gossip = { workspace = true }
blake3 = "1"
futures-lite = "2"
futures-util = "0.3"
bytes = "1"
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
rdm-core = { path = "../rdm-core" }
rdm-node = { path = "../rdm-node" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
rdm-client = { path = "../rdm-client" }
rafka-node-rpc = { path = "../rafka-node-rpc" }

[[bin]]
name = "rafka-node-admin"
path = "src/bin/rafka_node_admin.rs"

[dev-dependencies]
# seat_watch: the ladder cells run under paused time, so a probe's budget is exact, not a wall bound.
tokio = { workspace = true, features = ["test-util"] }
# i143_acceptance_2805: each acceptance cell captures its own spans through the product pipeline into
# an in-memory exporter installed on that cell's runtime threads, so cells sharing a test process never share one.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
# tests/main.rs: the binary's process environment is set once, in its ctor, before any thread exists.
ctor = "0.2"

[[test]]
name = "main"
path = "tests/main.rs"
