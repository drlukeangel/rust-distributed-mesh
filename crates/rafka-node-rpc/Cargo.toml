[package]
name = "rafka-node-rpc"
version = "0.1.0"
edition = "2021"
description = "Generic Node RPC runtime over Iroh: exact-target client/server, commit cut, admission (i143)"
publish = false

# No doctest exists here, and a doctest build links the unhashed libiroh.rlib that any concurrent cargo run rewrites (vendor/iroh is a path crate).
[lib]
doctest = false

[dependencies]
rafka-node-rpc-contract = { path = "../rafka-node-rpc-contract" }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde = { workspace = true }
# i143_acceptance_2781: the seeded scheduler and the UDP tap live in the scenario crate; each
# acceptance cell writes its result.json.
rafka-test-scenario = { path = "../rafka-test-scenario" }
serde_json = { workspace = true }
# i143_acceptance_2780: the proof store and its apply failpoints are the testkit seam the UNIT cells serve over real Node RPC.
rafka-node-rpc-testkit = { path = "../rafka-node-rpc-testkit" }
