[package]
autotests = false
name = "rafka-node-base"
version = "0.1.0"
edition = "2021"
description = "The product node base: a role process composed on the imported Mesh substrate (i143.e11)"
publish = false

# Exactly the import manifest a product takes (i141 PRD §3): the generic packages, by workspace
# path here, by one git+rev downstream. Nothing else of RDM.
[lib]
doctest = false

[dependencies]
rafka-node-rpc-contract = { path = "../rafka-node-rpc-contract" }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
rafka-node-rpc-testkit = { path = "../rafka-node-rpc-testkit" }
rafka-node-admin-client = { path = "../rafka-node-admin-client" }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
iroh = { workspace = true }

[dev-dependencies]
rafka-node-admin-core = { path = "../rafka-node-admin-core" }
rafka-node-rpc-testkit = { path = "../rafka-node-rpc-testkit", features = ["rig"] }

[[test]]
name = "main"
path = "tests/main.rs"
