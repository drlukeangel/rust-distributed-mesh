[package]
autotests = false
name = "rdm-node"
version = "0.1.0"
edition = "2021"
description = "The product node runtime: role process and member-side handlers composed on the imported Mesh substrate"
publish = false

[lib]
doctest = false

[features]
# Forward testkit fault seams on rdm-transport to rdm-test; absent from production builds.
testkit-gossip = ["rdm-transport/testkit-gossip"]

[dependencies]
futures-util = "0.3"
rdm-core = { path = "../rdm-core" }
rdm-client = { path = "../rdm-client" }
rdm-transport = { path = "../rdm-transport" }
anyhow = { workspace = true }
async-trait = "0.1"
hex = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
libc = "0.2"
rand = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)", "cfg(tokio_taskdump)"] }
