[package]
name = "rdm-admin"
version = "0.1.0"
edition = "2021"
description = "Generic Fabric/Mesh/Node control: model, topology, Build, deployment and lifecycle (i143)"
publish = false
autotests = false

[lib]
doctest = false

[features]
default = ["file-backend"]
# RDM standalone's durable-file backend of the six storage boundaries. Off, the build holds the
# boundaries and their memory backends only (block 1b's proof).
file-backend = ["rdm-node/file-backend"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
libc = "0.2"
iroh = { workspace = true }
iroh-gossip = { workspace = true }
blake3 = "1"
futures-lite = "2"
futures-util = "0.3"
bytes = "1"
rdm-transport = { path = "../rdm-transport" }
rdm-core = { path = "../rdm-core" }
rdm-node = { path = "../rdm-node", default-features = false }
rdm-client = { path = "../rdm-client" }

[[bin]]
name = "rdm-node-admin"
path = "src/bin/rdm_node_admin.rs"
required-features = ["file-backend"]

[dev-dependencies]
# primary_watch: the ladder cells run under paused time, so a probe's budget is exact, not a wall bound.
tokio = { workspace = true, features = ["test-util"] }
# i143_acceptance_2805: each acceptance cell captures its own spans through the product pipeline into
# an in-memory exporter installed on that cell's runtime threads, so cells sharing a test process never share one.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
# tests/main.rs: the binary's process environment is set once, in its ctor, before any thread exists.
ctor = "0.2"

[[test]]
name = "main"
path = "tests/main.rs"
