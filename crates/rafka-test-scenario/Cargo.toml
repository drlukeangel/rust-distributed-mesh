[package]
name = "rafka-test-scenario"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral scenario/evidence/replay contracts and the i143 Mesh product canaries"
publish = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13.3", features = ["json"] }
yaml_serde = "0.10"
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
# The consumer fixture executables (src/bin/consumer_*.rs) compose the public node runtime exactly as
# an external consumer's own executables do.
rafka-node-base = { path = "../rafka-node-base" }
rafka-node-admin-core = { path = "../rafka-node-admin-core" }

[dev-dependencies]
rafka-node-admin-client = { path = "../rafka-node-admin-client" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }

[[bin]]
name = "rafka-scenario"
path = "src/bin/rafka_scenario.rs"

# Four behaviour-empty executables standing in for an external consumer's own launch set: each
# is one call into the public node runtime and nothing else.
[[bin]]
name = "consumer-node-admin"
path = "src/bin/consumer_node_admin.rs"

[[bin]]
name = "consumer-broker"
path = "src/bin/consumer_broker.rs"

[[bin]]
name = "consumer-gateway"
path = "src/bin/consumer_gateway.rs"

[[bin]]
name = "consumer-compute"
path = "src/bin/consumer_compute.rs"
