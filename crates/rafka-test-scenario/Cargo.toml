[package]
name = "rafka-test-scenario"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral scenario/evidence/replay contracts and the i143 Mesh product canaries"
publish = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13.3", features = ["json"] }
yaml_serde = "0.10"
rafka-node-admin-client = { path = "../rafka-node-admin-client" }
rafka-node-rpc-contract = { path = "../rafka-node-rpc-contract" }

[dev-dependencies]
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
# i143_acceptance_2780 derives its cut list from the product's own documented step orders.
rafka-node-admin-core = { path = "../rafka-node-admin-core" }

[[bin]]
name = "rafka-scenario"
path = "src/bin/rafka_scenario.rs"
