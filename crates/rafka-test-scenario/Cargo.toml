[package]
name = "rafka-test-scenario"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral scenario/evidence/replay contracts and the i143 Mesh product canaries"
publish = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.13.3", features = ["json"] }
yaml_serde = "0.10"
rafka-node-admin-client = { path = "../rafka-node-admin-client" }
rafka-node-rpc-contract = { path = "../rafka-node-rpc-contract" }
libc = "0.2"

[dev-dependencies]
# i143_acceptance_2782 captures the detector's own spans in process.
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
# i143_acceptance_2780 derives its cut list from the product's own documented step orders.
rafka-node-admin-core = { path = "../rafka-node-admin-core" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
futures-lite = "2"
bytes = "1"

[[bin]]
name = "rafka-scenario"
path = "src/bin/rafka_scenario.rs"
