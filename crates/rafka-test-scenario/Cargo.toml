[package]
name = "rafka-test-scenario"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral scenario/evidence/replay contracts and the i143 Mesh product canaries"
publish = false
autotests = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
yaml_serde = "0.10"
rafka-node-admin-client = { path = "../rafka-node-admin-client" }
rafka-node-rpc-contract = { path = "../rafka-node-rpc-contract" }
# The fault door (op 0x75): the cells arm, read and release a faulted admin's cuts through its typed calls.
rafka-node-rpc-testkit = { path = "../rafka-node-rpc-testkit" }
libc = "0.2"
rafka-chaos = { path = "../rafka-chaos" }

[dev-dependencies]
rafka-mesh-entity = { path = "../rafka-mesh-entity" }
# i143_acceptance_2782 captures the detector's own spans in process.
tracing-subscriber = { workspace = true }
rafka-mesh-telemetry = { path = "../rafka-mesh-telemetry" }
rafka-node-rpc = { path = "../rafka-node-rpc" }
# node_rpc__scheduler_replay switches NAT traversal off on its endpoints (R-I3); `test-knobs` is a dev-dependency
# feature only, and `dep-rules` refuses it anywhere else.
iroh = { workspace = true, features = ["test-knobs"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rafka-mesh-transport = { path = "../rafka-mesh-transport" }
# i143_acceptance_2780 derives its cut list from the product's own documented step orders.
rafka-node-admin-core = { path = "../rafka-node-admin-core" }
iroh-gossip = { workspace = true }
futures-lite = "2"
bytes = "1"

[[bin]]
name = "rafka-scenario"
path = "src/bin/rafka_scenario.rs"

[[test]]
name = "main"
path = "tests/main.rs"
