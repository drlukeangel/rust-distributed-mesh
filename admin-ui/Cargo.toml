[package]
name = "rafka-admin-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "rafka_admin_ui"
path = "src/lib.rs"

[[bin]]
name = "rafka-admin-ui"
path = "src/main.rs"

[dependencies]
rafka-mesh-telemetry = { path = "../crates/rafka-mesh-telemetry" }
rafka-node-admin-client = { path = "../crates/rafka-node-admin-client" }
rafka-mesh-entity = { path = "../crates/rafka-mesh-entity" }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["cors", "fs", "timeout"] }
tower = { version = "0.5", features = ["timeout", "limit", "util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "http1", "tokio"] }
reqwest = { version = "0.13.3", features = ["json"] }
dashmap = { workspace = true }
rand = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = "0.27"
tracing-opentelemetry = { workspace = true }
http = "1"
urlencoding = "2"

dhat = { version = "0.3.3", optional = true }
mimalloc = "0.1.52"

[dev-dependencies]
rafka-node-admin-core = { path = "../crates/rafka-node-admin-core" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
# dhat heap profiling is OFF by default. dhat installs a global allocator that
# records EVERY allocation in an ever-growing table — on a busy process like
# admin-ui that reads as a ~2 MB/min "leak" that isn't one. Enable only to
# profile: cargo build -p rafka-admin-ui --release --features dhat-heap
dhat-heap = ["dep:dhat"]
