name: i143 gates

# The i143 opening-audit gates (tools/mesh-audit): legacy-binary disposition,
# transport-parity scanner fixtures and the PRD §4 dependency rules; and the
# deployment-provider smokes against real processes and containers.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: audit gate tests
        run: cargo test -p rafka-mesh-audit
      - name: dependency rules
        run: cargo run -q -p rafka-mesh-audit --bin dep-rules
      - name: Node RPC runtime and pool (functional)
        run: cargo test -p rafka-node-rpc-contract -p rafka-node-rpc

  # The deployment providers against real runtimes: the same smoke with
  # MESH_SPAWN_TYPE=process and =container. On this runner the container
  # provider is supported, so a skip is a failure.
  providers:
    runs-on: ubuntu-latest
    env:
      RAFKA_REQUIRE_CONTAINER: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: provider smokes
        run: cargo test -p rafka-node-admin-core -p rafka-node-rpc-testkit
      - name: admin-ui is a node-admin client
        run: cargo test -p rafka-admin-ui --test ui_flows
      - name: SN/MN/MM shapes converge (process E2E)
        run: |
          cargo build -p rafka-node-admin-core -p rafka-node-rpc-testkit --bins
          cargo test -p rafka-test-scenario --test mesh_shapes__shape_reconcile
      - name: live resize, MN and MM (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_shapes__live_resize
      - name: cohort election matrix (process E2E, partition through iptables)
        env:
          RAFKA_REQUIRE_NETFAULT: "1"
        run: cargo test -p rafka-test-scenario --test mesh_elections__cohort_election
      - name: fabric-primary failover and path fence (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_elections__fabric_primary
      - name: mesh creation contract (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_lifecycle__mesh_create
      - name: mesh recovery contract (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_lifecycle__mesh_recover
      - name: hierarchical membership, mesh channels and the admin backbone (process E2E, partition through iptables)
        env:
          RAFKA_REQUIRE_NETFAULT: "1"
        run: cargo test -p rafka-test-scenario --test mesh_membership__backbone
