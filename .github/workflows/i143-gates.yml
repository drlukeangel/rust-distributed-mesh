name: i143 gates

# The i143 opening-audit gates (tools/mesh-audit): legacy-binary disposition,
# transport-parity scanner fixtures and the PRD §4 dependency rules; and the
# deployment-provider smokes against real processes and containers.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: audit gate tests
        run: cargo test -p rafka-mesh-audit
      - name: dependency rules
        run: cargo run -q -p rafka-mesh-audit --bin dep-rules
      - name: address-lookup boundary (no n0 DNS/Pkarr; canonical crates off the legacy plane)
        run: cargo run -q -p rafka-mesh-audit --bin address-lookup
      - name: Node RPC runtime and pool (functional)
        run: cargo test -p rafka-node-rpc-contract -p rafka-node-rpc

  # The deployment providers against real runtimes: the same smoke with
  # MESH_SPAWN_TYPE=process and =container. On this runner the container
  # provider is supported, so a skip is a failure.
  providers:
    runs-on: ubuntu-latest
    env:
      RAFKA_REQUIRE_CONTAINER: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: provider smokes
        run: cargo test -p rafka-node-admin-core -p rafka-node-rpc-testkit
      - name: admin-ui is a node-admin client
        run: cargo test -p rafka-admin-ui --test ui_flows
      - name: SN/MN/MM shapes converge (process E2E)
        run: |
          cargo build -p rafka-node-admin-core -p rafka-node-rpc-testkit --bins
          cargo test -p rafka-test-scenario --test mesh_shapes__shape_reconcile
      - name: live resize, MN and MM (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_shapes__live_resize
      - name: cohort election matrix (process E2E, partition through iptables)
        env:
          RAFKA_REQUIRE_NETFAULT: "1"
        run: cargo test -p rafka-test-scenario --test mesh_elections__cohort_election
      - name: fabric-primary failover and path fence (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_elections__fabric_primary
      - name: mesh creation contract (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_lifecycle__mesh_create
      - name: mesh recovery contract (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_lifecycle__mesh_recover
      - name: canonical Crockford60 product ids (process E2E)
        run: cargo test -p rafka-test-scenario --test mesh_identity__canonical_ids
      - name: hierarchical membership, mesh channels and the admin backbone (process E2E, partition through iptables)
        env:
          RAFKA_REQUIRE_NETFAULT: "1"
        run: cargo test -p rafka-test-scenario --test mesh_membership__backbone
      # Last: it runs as root inside its own network namespace.
      - name: no implicit address lookup, two meshes converge with no route off the host (process E2E)
        env:
          RAFKA_REQUIRE_NETFAULT: "1"
        run: |
          cargo test -p rafka-test-scenario --test mesh_shapes__live_resize --test mesh_membership__backbone --no-run
          scripts/netless.sh cargo test --offline -p rafka-test-scenario --test mesh_shapes__live_resize mm_
          scripts/netless.sh cargo test --offline -p rafka-test-scenario --test mesh_membership__backbone
      # The E2E evidence: every node's spans and stderr, when a step fails.
      - name: E2E evidence on failure
        if: failure()
        run: |
          mkdir -p e2e-evidence
          cp -r crates/rafka-test-scenario/tests/artifacts e2e-evidence/ 2>/dev/null || true
          for d in /tmp/i143-*; do [ -d "$d" ] && sudo cp -r "$d" e2e-evidence/ 2>/dev/null || true; done
          sudo chown -R "$(id -u)" e2e-evidence || true
          # A timeline in the log too: the membership/election/partition spans
          # of every failed backbone run, and each admin's warnings.
          for t in e2e-evidence/artifacts/mesh-membership/*/; do
            echo "=== $t"
            cat "$t"spans/*.jsonl 2>/dev/null | jq -r 'select(.name|test("reconcile|node.create.via-build|cut-off|refeed|resubscribe|mesh-silent|mesh-learned|recompute|status-publisher|aggregate-publisher|backbone-peers|via-ready|via-signal|neighbor-up")) | [(.start_unix_nano/1e6|floor), .name, (.attributes.node // .attributes.observer // .attributes.fabric // ""), (.attributes.role // .attributes.mesh // .attributes.channel // .attributes.primary // .attributes.reason // ""), (.attributes.peers // .attributes.previous // "")] | @tsv' | sort -n | awk -F'\t' 'NR==1{t0=$1}{printf "%7d %-55s %-15s %s %s\n",$1-t0,$2,$3,$4,$5}' | tail -150
          done
          for d in e2e-evidence/i143-*/*admin*; do echo "=== $d"; grep -hE " WARN | ERROR " "$d"/stderr.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-220 | tail -15; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-evidence
          path: e2e-evidence
          retention-days: 7
