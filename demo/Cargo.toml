# The i143 R-shape qualification consumer: a fresh, business-empty application that imports the
# candidate RDM crates the way Rafka does, by git dependency pinned to one exact commit. It is
# EXCLUDED from the RDM root workspace (root Cargo.toml `exclude`) and is its own workspace
# root (the [workspace] table below, whose one member is admin-ui), with its own lockfile.
#
# Rules the static ratchet enforces (tools/mesh-audit/tests/rshape_definition.rs): every RDM
# dependency is a git dependency on the RDM repository at ONE exact 40-hex rev; no path
# dependency, no [patch], no [replace], no branch/tag, no Rafka business crate.
[package]
name = "rshape-consumer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Business-empty R-shape consumer: four node entry points composed through RDM's public seams"

[workspace]
members = ["admin-ui"]

[dependencies]
rafka-node-base = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "2109b643c2b18e688101c76496d7fef296cf9f35" }
rafka-node-admin-core = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "2109b643c2b18e688101c76496d7fef296cf9f35" }
rafka-mesh-transport = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "2109b643c2b18e688101c76496d7fef296cf9f35" }
rafka-mesh-telemetry = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "2109b643c2b18e688101c76496d7fef296cf9f35" }
# The carrier policy this shape declares for the originate door (a gateway carries).
rafka-mesh-entity = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "2109b643c2b18e688101c76496d7fef296cf9f35" }
# Qualification-only: the testkit protocols 0x70-0x73 (proof store, resolve probe, declare probe,
# originate) the mock roles serve, and the process bring-up they act through.
rafka-node-rpc-testkit = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "2109b643c2b18e688101c76496d7fef296cf9f35" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"

# The executable binding re-hashes every bound file at every launch and every admin birth hashes the
# whole set; an unoptimised sha2 takes 4.4 s per 430 MB debug executable (RDM's own workspace sets
# the same profile).
# As the RDM root: line tables only, so each consumer binary is a fraction of a full-debuginfo one
# (the executable bindings hash every bound file, and the bootstrap admin hashes all of them).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.sha2]
opt-level = 3

[lib]
name = "rshape_consumer"
path = "src/lib.rs"

[[bin]]
name = "rshape-node-admin"
path = "src/bin/rshape_node_admin.rs"

[[bin]]
name = "rshape-compute"
path = "src/bin/rshape_compute.rs"

[[bin]]
name = "rshape-gateway"
path = "src/bin/rshape_gateway.rs"

[[bin]]
name = "rshape-broker"
path = "src/bin/rshape_broker.rs"
