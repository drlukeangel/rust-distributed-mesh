[package]
name = "rafka-admin-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "The demo admin UI: a node-admin client that draws the mesh truthfully"

[lib]
name = "rafka_admin_ui"
path = "src/lib.rs"

[[bin]]
name = "rafka-admin-ui"
path = "src/main.rs"

[dependencies]
rdm-transport = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "f29c747a22a2e763478f49f99530e686eb233e28" }
rdm-client = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "f29c747a22a2e763478f49f99530e686eb233e28" }
rdm-core = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "f29c747a22a2e763478f49f99530e686eb233e28" }
rdm-test = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "f29c747a22a2e763478f49f99530e686eb233e28" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["fs"] }
reqwest = { version = "0.13.3", features = ["json"] }
urlencoding = "2"

[dev-dependencies]
rdm-admin = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "f29c747a22a2e763478f49f99530e686eb233e28" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
