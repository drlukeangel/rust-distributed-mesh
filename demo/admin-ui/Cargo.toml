[package]
name = "rafka-admin-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "The demo admin UI: a node-admin client that draws the mesh truthfully"

[lib]
name = "rafka_admin_ui"
path = "src/lib.rs"

[[bin]]
name = "rafka-admin-ui"
path = "src/main.rs"

[dependencies]
rafka-mesh-telemetry = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "426bed4a743c73482ed6c0383968a52b38721976" }
rafka-node-admin-client = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "426bed4a743c73482ed6c0383968a52b38721976" }
rafka-mesh-entity = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "426bed4a743c73482ed6c0383968a52b38721976" }
rafka-chaos = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "426bed4a743c73482ed6c0383968a52b38721976" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["fs"] }
reqwest = { version = "0.13.3", features = ["json"] }
urlencoding = "2"

[dev-dependencies]
rafka-mesh-transport = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "426bed4a743c73482ed6c0383968a52b38721976" }
rafka-node-admin-core = { git = "https://github.com/drlukeangel/rust-distributed-mesh", rev = "426bed4a743c73482ed6c0383968a52b38721976" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
